name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-host:
    name: Firmware host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile and run firmware host checks
        run: |
          bash firmware/tests/run_nvs_init_host_tests.sh
          bash firmware/tests/run_no_legacy_tests.sh
          bash firmware/tests/run_rest_host_tests.sh
      - name: Check device configuration and flash backup tools
        run: python -m unittest discover -s device -p 'test_*.py'

  server:
    name: Gateway and admin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test gateway and authenticated admin proxy
        run: node --test server/gateway/*.test.js
      - name: Test admin login and credential storage
        run: python -m unittest discover -s server/admin -p 'test_*.py'
      - name: Check installer shell syntax
        run: |
          for script in server/install/*.sh; do
            bash -n "$script"
          done
