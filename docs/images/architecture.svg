    <rect x="35" y="97" width="210" height="130" rx="18" fill="#fff" stroke="#c6d2f2" stroke-width="2"/><text x="55" y="132" font-size="21" font-weight="700">Колонка</text><text x="55" y="161" font-size="16">ESP32-S3 · экран</text><text x="55" y="187" font-size="16">микрофон · динамик</text>
