    <rect x="762" y="66" width="275" height="60" rx="14" fill="#fff" stroke="#c6d2f2" stroke-width="2"/><text x="784" y="102" font-size="18">OpenAI · голосовой ответ</text>
    <rect x="762" y="139" width="275" height="60" rx="14" fill="#fff" stroke="#c6d2f2" stroke-width="2"/><text x="784" y="175" font-size="18">Яндекс · поиск картинок</text>
    <rect x="762" y="212" width="275" height="60" rx="14" fill="#fff" stroke="#c6d2f2" stroke-width="2"/><text x="784" y="248" font-size="18">Сайты изображений</text>
