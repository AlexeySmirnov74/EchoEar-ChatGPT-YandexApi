<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура EchoEar</title><desc id="desc">Колонка подключается к собственному серверу, который обращается к OpenAI, Яндекс Поиску и сайтам изображений.</desc>
